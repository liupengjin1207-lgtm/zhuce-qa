<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a5fb4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-startup-image" href="icon-512.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>2026年黄埔区教师资格定期注册 · 智能答疑</title>
<style>
  :root{
    --brand:#1a5fb4;
    --brand-dark:#12447f;
    --brand-light:#e8f0fb;
    --accent:#c62828;
    --ok:#2e7d32;
    --warn:#e65100;
    --text:#1f2328;
    --text2:#5a6371;
    --line:#e3e8ef;
    --bg:#f5f7fa;
    --card:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
    background:var(--bg);color:var(--text);
    display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
    font-size:15px;line-height:1.65;
  }

  /* 顶部栏 */
  header{
    background:linear-gradient(135deg,var(--brand),var(--brand-dark));
    color:#fff;padding:14px 16px 13px;flex-shrink:0;
    box-shadow:0 2px 10px rgba(26,95,180,.22);z-index:10;
  }
  .hd-top{display:flex;align-items:center;gap:10px}
  .hd-logo{
    width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;
  }
  .hd-title{font-size:15.5px;font-weight:600;letter-spacing:.2px;line-height:1.3}
  .hd-sub{font-size:11.5px;opacity:.82;margin-top:2px}

  /* 消息区 */
  #chat{flex:1;overflow-y:auto;padding:16px 14px 8px;-webkit-overflow-scrolling:touch}
  .msg{max-width:100%;margin-bottom:14px;display:flex;animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

  .msg.me{justify-content:flex-end}
  .bubble-me{
    background:var(--brand);color:#fff;padding:9px 14px;border-radius:15px 15px 3px 15px;
    max-width:80%;font-size:14.5px;word-break:break-word;box-shadow:0 1px 4px rgba(26,95,180,.2);
  }

  .msg.bot{justify-content:flex-start}
  .bot-wrap{max-width:94%;width:100%}
  .bot-avatar{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);
    margin-bottom:5px;font-weight:500;
  }
  .bot-avatar .dot{width:16px;height:16px;border-radius:50%;background:var(--brand);
    display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px}

  .card{
    background:var(--card);border-radius:14px 14px 14px 3px;padding:14px 15px;
    box-shadow:0 1px 3px rgba(0,0,0,.07),0 6px 18px -8px rgba(0,0,0,.1);
    border:1px solid var(--line);word-break:break-word;
  }
  .card.ans{width:100%}

  .ans-q{font-weight:600;font-size:14.5px;color:var(--brand-dark);
    padding-bottom:9px;margin-bottom:10px;border-bottom:1px dashed var(--line);
    display:flex;align-items:flex-start;gap:7px}
  .ans-q .n{
    flex-shrink:0;width:18px;height:18px;border-radius:5px;background:var(--brand-light);
    color:var(--brand);font-size:11px;display:flex;align-items:center;justify-content:center;
    margin-top:2px;font-weight:700;
  }
  .ans-body{font-size:14.5px;color:var(--text)}
  .ans-body p{margin:0 0 8px}
  .ans-body p:last-child{margin-bottom:0}
  .ans-body strong{color:var(--brand-dark);font-weight:600}
  .ans-body ul,.ans-body ol{margin:6px 0;padding-left:19px}
  .ans-body li{margin-bottom:4px}
  .ans-body code{background:#f0f3f7;padding:1px 5px;border-radius:4px;font-size:13px}
  .ans-body hr{border:0;border-top:1px dashed var(--line);margin:10px 0}

  /* 表格 */
  .ans-body table{width:100%;border-collapse:collapse;margin:9px 0;font-size:13px;display:block;overflow-x:auto}
  .ans-body th,.ans-body td{border:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
  .ans-body th{background:var(--brand-light);color:var(--brand-dark);font-weight:600}

  .ans-src{
    margin-top:11px;padding-top:9px;border-top:1px dashed var(--line);
    font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px;
  }
  .ans-src .tag{background:var(--brand-light);color:var(--brand);padding:1px 7px;border-radius:20px;font-size:11px}

  .ai-badge{background:#7c3aed;color:#fff;font-size:10px;padding:1px 7px;border-radius:20px;margin-left:2px}

  /* 反馈按钮 */
  .fb-btn{
    display:inline-flex;align-items:center;gap:4px;margin-top:9px;font-size:12px;color:#8a94a3;
    background:#f5f7fa;border:1px solid var(--line);border-radius:14px;padding:4px 11px;cursor:pointer;
    font-family:inherit;transition:.16s;
  }
  .fb-btn:active{background:#eceff4}
  .fb-done{color:#2e7d32;border-color:#c8e6c9;background:#f0f9f0}

  .ai-btn{
    display:inline-flex;align-items:center;gap:4px;margin-top:9px;margin-left:6px;font-size:12px;
    color:#7c3aed;background:#f6f2ff;border:1px solid #ddd0f7;border-radius:14px;padding:4px 11px;
    cursor:pointer;font-family:inherit;transition:.16s;font-weight:500;
  }
  .ai-btn:active{background:#ece3fc;transform:scale(.97)}
  .ai-btn.loading{color:#9a86c4;cursor:wait}

  /* 添加到桌面引导：底部悬浮横幅 */
  .pwa-banner{
    position:fixed;left:12px;right:12px;bottom:76px;z-index:60;
    background:linear-gradient(135deg,#1a5fb4,#3f83d8);color:#fff;
    border-radius:14px;padding:12px 14px;box-shadow:0 6px 22px rgba(26,95,180,.35);
    display:flex;align-items:center;gap:11px;
    animation:pwaUp .35s ease;
  }
  @keyframes pwaUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .pwa-ico{font-size:26px;flex-shrink:0}
  .pwa-txt{flex:1;font-size:12.5px;line-height:1.55;min-width:0}
  .pwa-txt b{font-size:13.5px;display:block;margin-bottom:1px}
  .pwa-txt span{opacity:.85}
  .pwa-go{
    flex-shrink:0;border:0;background:#fff;color:var(--brand);font-weight:700;font-family:inherit;
    font-size:13px;padding:8px 13px;border-radius:20px;cursor:pointer;white-space:nowrap;
  }
  .pwa-go:active{transform:scale(.95)}
  .pwa-x{
    position:absolute;top:-9px;right:-4px;border:0;background:#fff;color:#8b97a8;
    width:22px;height:22px;border-radius:50%;font-size:12px;cursor:pointer;
    box-shadow:0 1px 5px rgba(0,0,0,.18);font-family:inherit;line-height:1;
  }
  /* 教程弹窗 */
  .pwa-mask{
    position:fixed;inset:0;background:rgba(15,30,55,.5);z-index:70;
    display:flex;align-items:center;justify-content:center;padding:22px;
  }
  .pwa-modal{
    background:#fff;border-radius:16px;padding:20px 18px;max-width:360px;width:100%;
    max-height:78vh;overflow:auto;position:relative;
  }
  .pwa-modal h3{margin:0 0 10px;font-size:16px;color:var(--brand-dark)}
  .pwa-modal ol{margin:0;padding-left:20px;font-size:13.5px;line-height:2;color:var(--text)}
  .pwa-modal .ok-btn{
    display:block;width:100%;margin-top:14px;border:0;background:var(--brand);color:#fff;
    font-size:14px;font-weight:600;padding:10px;border-radius:10px;cursor:pointer;font-family:inherit;
  }
  .pwa-modal .mx{position:absolute;top:10px;right:12px;border:0;background:none;color:#9aa4b2;font-size:17px;cursor:pointer;font-family:inherit}

  /* 相关追问 */
  .related{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)}
  .related-t{font-size:11.5px;color:var(--text2);margin-bottom:7px}
  .chip{
    display:inline-block;background:#f0f4fa;border:1px solid #dbe6f5;color:var(--brand);
    padding:5px 11px;border-radius:16px;font-size:13px;margin:0 6px 6px 0;cursor:pointer;
    transition:.16s;line-height:1.4;
  }
  .chip:active{background:#dce8f8;transform:scale(.97)}

  /* 兜底/候选 */
  .fallback{font-size:14px;color:var(--text)}
  .fallback .big{font-weight:600;color:var(--warn);margin-bottom:6px;display:block}
  .fb-tip{
    background:#fff8e6;border-left:3px solid #ffb300;padding:9px 11px;border-radius:6px;
    font-size:13px;color:#7a5300;margin-top:9px;line-height:1.6;
  }
  .cand-list{margin-top:4px}
  .cand{
    display:block;width:100%;text-align:left;background:#f8fafc;border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13.5px;color:var(--text);
    cursor:pointer;transition:.16s;font-family:inherit;
  }
  .cand:active{background:var(--brand-light);border-color:#c3d7f0}
  .cand .c-cat{font-size:11px;color:var(--brand);background:var(--brand-light);
    padding:1px 7px;border-radius:20px;margin-right:7px}

  /* 欢迎区 */
  .welcome{text-align:center;padding:6px 4px 14px}
  .wel-h{font-size:16px;font-weight:600;color:var(--brand-dark);margin-bottom:5px}
  .wel-s{font-size:13px;color:var(--text2);line-height:1.7}

  .quick-t{font-size:12.5px;color:var(--text2);text-align:left;margin:16px 0 9px;display:flex;align-items:center;gap:7px}
  .quick-t::after{content:"";flex:1;height:1px;background:var(--line)}
  .quick-grid{display:flex;flex-direction:column;gap:8px}
  .quick{
    display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
    border-radius:11px;padding:11px 13px;font-size:14px;color:var(--text);cursor:pointer;
    transition:.16s;text-align:left;font-family:inherit;width:100%;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .quick:active{background:var(--brand-light);border-color:#c3d7f0;transform:scale(.99)}
  .quick .qi{font-size:15px;flex-shrink:0}
  .quick .qt{flex:1}
  .quick .qa{color:#c3ccd8;font-size:15px}

  /* 输入区 */
  footer{
    flex-shrink:0;background:var(--card);border-top:1px solid var(--line);
    padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  }
  .in-row{display:flex;gap:8px;align-items:flex-end}
  #q{
    flex:1;border:1px solid var(--line);border-radius:20px;padding:10px 15px;font-size:15px;
    font-family:inherit;resize:none;outline:none;max-height:110px;line-height:1.5;
    background:#f7f9fc;transition:.18s;color:var(--text);
  }
  #q:focus{background:#fff;border-color:#a9c6ea;box-shadow:0 0 0 3px rgba(26,95,180,.09)}
  #send{
    width:40px;height:40px;border-radius:50%;border:0;background:var(--brand);color:#fff;
    font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    transition:.16s;box-shadow:0 2px 7px rgba(26,95,180,.3);
  }
  #send:active{transform:scale(.93)}
  #send:disabled{background:#c3ccd8;box-shadow:none;cursor:not-allowed}
  .foot-tip{font-size:10.5px;color:#9aa4b2;text-align:center;margin-top:6px}

  /* ===== 统计入口按钮 ===== */
  .stats-btn{
    position:fixed;right:14px;bottom:132px;width:38px;height:38px;border-radius:50%;
    border:1px solid #dbe6f5;background:rgba(255,255,255,.86);color:#8b97a8;font-size:16px;
    cursor:pointer;z-index:55;box-shadow:0 2px 8px rgba(31,35,40,.10);transition:.15s;
    font-family:inherit;line-height:1;
  }
  .stats-btn.hot{background:var(--brand-light);color:var(--brand);transform:scale(1.08)}

  /* ===== 统计面板 ===== */
  .st-mask{position:fixed;inset:0;background:rgba(15,30,55,.55);z-index:80;display:flex;align-items:flex-end;justify-content:center}
  .st-panel{
    background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:520px;
    height:88vh;display:flex;flex-direction:column;
    animation:stUp .28s ease;
  }
  @keyframes stUp{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
  .st-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line);flex-shrink:0}
  .st-title{font-size:15px;font-weight:700;color:var(--brand-dark)}
  .st-close{border:0;background:none;font-size:17px;color:#9aa4b2;cursor:pointer;font-family:inherit;padding:2px 6px}
  .st-body{flex:1;overflow-y:auto;padding:14px 16px 24px;-webkit-overflow-scrolling:touch}
  .st-loading{text-align:center;color:var(--text2);font-size:13px;padding:40px 0}
  .st-err{text-align:center;color:var(--accent);font-size:13.5px;padding:36px 10px;line-height:1.9}

  .st-login{padding:22px 0}
  .st-login input{
    width:100%;box-sizing:border-box;padding:11px 13px;border:1px solid #d5dfec;border-radius:10px;
    font-size:14px;font-family:inherit;outline:none;margin-bottom:10px;
  }
  .st-login input:focus{border-color:var(--brand)}
  .st-login button{
    width:100%;border:0;background:var(--brand);color:#fff;font-size:14px;font-weight:600;
    padding:11px;border-radius:10px;cursor:pointer;font-family:inherit;
  }
  .shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .st-cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
  .st-card{background:linear-gradient(135deg,#f2f7ff,#f8fbff);border:1px solid #e0eaf8;border-radius:11px;padding:11px 12px}
  .st-card .n{font-size:22px;font-weight:800;color:var(--brand);line-height:1.2}
  .st-card .l{font-size:11px;color:var(--text2);margin-top:2px}
  .st-card.warn{background:linear-gradient(135deg,#fff6ec,#fffaf5);border-color:#f6e0c8}
  .st-card.warn .n{color:var(--warn)}

  .st-sec{margin-bottom:18px}
  .st-sec-t{font-size:13px;font-weight:700;color:var(--text);margin-bottom:9px;display:flex;align-items:center;gap:6px}
  .st-cnt{background:#eef2f8;color:var(--text2);font-size:11px;font-weight:600;padding:1px 7px;border-radius:9px}

  .st-bars{display:flex;align-items:flex-end;gap:4px;height:96px;padding:0 2px;overflow-x:auto}
  .st-bar-wrap{flex:1;min-width:22px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .st-bar{width:100%;max-width:20px;background:linear-gradient(180deg,#5b9ae4,#1a5fb4);border-radius:3px 3px 0 0;min-height:6px}
  .st-bar-n{font-size:9.5px;color:var(--brand);font-weight:700;margin-top:2px}
  .st-bar-d{font-size:8.5px;color:#9aa4b2;margin-top:1px;white-space:nowrap}

  .st-list{display:flex;flex-direction:column;gap:1px}
  .st-item{display:flex;align-items:flex-start;gap:8px;padding:8px 4px;border-bottom:1px solid #f2f5f9;font-size:13px}
  .st-item:last-child{border-bottom:0}
  .st-idx{flex-shrink:0;width:19px;height:19px;border-radius:5px;background:#f0f4fa;color:#8b97a8;
    font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .st-item.u .st-idx{background:#fdecea;color:var(--accent)}
  .st-q{flex:1;color:var(--text);line-height:1.5;word-break:break-word}
  .st-num{flex-shrink:0;font-size:11.5px;color:var(--brand);font-weight:700;margin-top:2px}
  .st-item.u .st-num{color:var(--accent)}
  .st-tag{font-style:normal;font-size:9.5px;padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:1px}
  .st-tag.bad{background:#fdecea;color:var(--accent)}
  .st-tag.warn{background:#fff4e5;color:#a35a00}
  .st-tag.ai{background:#f0eafb;color:#6b4fa8}

  .st-empty{font-size:12.5px;color:#8b97a8;padding:10px 4px}
  .st-actions{display:flex;gap:9px;margin-top:6px}
  .st-actions button{
    flex:1;border:1px solid #dbe6f5;background:#f7fafd;color:var(--brand);font-size:13px;
    font-weight:600;padding:10px;border-radius:10px;cursor:pointer;font-family:inherit;
  }
  .st-actions button:active{background:#e8f0fb}

  /* 打字动画 */
  .typing{display:flex;gap:4px;padding:5px 2px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#b6c3d4;animation:bl 1.3s infinite}
  .typing i:nth-child(2){animation-delay:.18s}
  .typing i:nth-child(3){animation-delay:.36s}
  @keyframes bl{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:#ccd5e0;border-radius:3px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<header>
  <div class="hd-top">
    <div class="hd-logo">📋</div>
    <div>
      <div class="hd-title">2026年教师资格定期注册 · 智能答疑</div>
      <div class="hd-sub">依据《黄埔区教师资格定期注册培训（2026）》自动作答</div>
    </div>
  </div>
</header>

<div id="chat"></div>

<footer>
  <div class="in-row">
    <textarea id="q" rows="1" placeholder="输入你的问题，如：我2021年注册的今年要不要注册？"></textarea>
    <button id="send" aria-label="发送">➤</button>
  </div>
  <div class="foot-tip">答案依据官方培训材料原文生成，特殊情况请咨询区注册工作办公室</div>
</footer>

<script src="knowledge.js?v=20261031a"></script>
<script src="engine.js?v=20261031a"></script>
<script src="stats.js?v=20261031a"></script>
<script>
/* 注册 Service Worker（PWA 可安装资格） */
if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}

/* 捕获安装事件：支持的环境下点按钮直接弹系统安装框 */
let _deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  _deferredPrompt = e;
  // 如果横幅已显示，把按钮文案换成更直接的"一键添加"
  const go = document.getElementById('pwaGo');
  if (go) go.textContent = '一键添加 ⚡';
});
window.addEventListener('appinstalled', ()=>{
  hidePwaBanner();
  try{ localStorage.setItem('pwa_tip_hide', '1'); }catch(e){}
});
function hidePwaBanner(){
  const b = document.getElementById('pwaBanner');
  if (b) b.remove();
}
/* 添加到桌面：底部悬浮横幅 + 一键安装/图文教程 */
function showPwaBanner(){
  let hidden = false;
  try{
    const t = localStorage.getItem('pwa_tip_hide');
    hidden = t && (Date.now() - Number(t) < 7*24*3600*1000); // 关闭后 7 天内不再显示
  }catch(e){}
  if (hidden || document.getElementById('pwaBanner')) return;
  const banner = document.createElement('div');
  banner.id = 'pwaBanner';
  banner.className = 'pwa-banner';
  banner.innerHTML = `
    <button class="pwa-x" aria-label="关闭">✕</button>
    <div class="pwa-ico">📲</div>
    <div class="pwa-txt"><b>添加到手机桌面</b><span>像 App 一样点开就用，不用翻群聊记录</span></div>
    <button class="pwa-go" id="pwaGo">立即添加</button>`;
  document.body.appendChild(banner);
  banner.querySelector('.pwa-x').addEventListener('click', ()=>{
    try{ localStorage.setItem('pwa_tip_hide', String(Date.now())); }catch(e){}
    hidePwaBanner();
  });
  banner.querySelector('.pwa-go').addEventListener('click', pwaGoClick);
}
async function pwaGoClick(){
  if (_deferredPrompt){
    // 支持：直接弹系统安装框
    _deferredPrompt.prompt();
    const { outcome } = await _deferredPrompt.userChoice.catch(()=>({outcome:'dismissed'}));
    if (outcome === 'accepted'){
      hidePwaBanner();
      try{ localStorage.setItem('pwa_tip_hide','1'); }catch(e){}
    }
    _deferredPrompt = null;
    return;
  }
  // 不支持 beforeinstallprompt（iOS / 部分国产浏览器）：弹图文教程
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isAndroid = /android/i.test(navigator.userAgent);
  let steps;
  if (isIOS){
    steps = `<li>用 <b>Safari 浏览器</b>打开本页面（其他浏览器不支持）</li>
      <li>点底部中间的<b>分享按钮 ⬆️</b></li>
      <li>往下找到并点<b>「添加到主屏幕」</b></li>
      <li>点右上角<b>「添加」</b>完成</li>`;
  }else if (isAndroid){
    steps = `<li>点浏览器<b>右上角 ⋮</b>（或底部菜单 ≡）</li>
      <li>找到并点<b>「添加到主屏幕」</b>或<b>「添加到桌面」</b></li>
      <li>在弹窗里点<b>「添加」</b>完成</li>
      <li>如果找不到该选项，换 <b>Chrome 浏览器</b>打开本页试试</li>`;
  }else{
    steps = `<li>点浏览器地址栏右侧的 <b>⊕</b> 或 <b>⋮</b></li>
      <li>选择<b>「安装」</b>或<b>「添加到主屏幕」</b></li>
      <li>在弹窗里点<b>「安装」</b>完成</li>`;
  }
  const mask = document.createElement('div');
  mask.className = 'pwa-mask';
  mask.innerHTML = `<div class="pwa-modal">
      <button class="mx">✕</button>
      <h3>📲 添加到桌面 · 图文步骤</h3>
      <ol>${steps}</ol>
      <button class="ok-btn">我知道了</button>
    </div>`;
  document.body.appendChild(mask);
  mask.addEventListener('click', e=>{ if (e.target===mask || e.target.classList.contains('ok-btn') || e.target.classList.contains('mx')) mask.remove(); });
}
</script>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('q');
const sendBtn = document.getElementById('send');

/* 极简 Markdown 渲染（够用即可，防 XSS） */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function md(text){
  let t = esc(text);
  // 表格
  const lines = t.split('\n');
  let html = '', i = 0;
  while (i < lines.length) {
    if (/^\s*\|/.test(lines[i]) && i+1 < lines.length && /^\s*\|[\s\-:|]+\|\s*$/.test(lines[i+1])) {
      let head = lines[i].split('|').slice(1,-1).map(s=>s.trim());
      i += 2;
      let rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) {
        rows.push(lines[i].split('|').slice(1,-1).map(s=>s.trim()));
        i++;
      }
      html += '<table><thead><tr>' + head.map(h=>`<th>${h}</th>`).join('') + '</tr></thead><tbody>'
            + rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')
            + '</tbody></table>';
      continue;
    }
    html += lines[i] + (i < lines.length-1 ? '\n' : '');
    i++;
  }
  // 行内
  html = html.replace(/^### (.+)$/gm,'<p><strong>$1</strong></p>')
             .replace(/^## (.+)$/gm,'<p><strong>$1</strong></p>')
             .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
             .replace(/`([^`]+)`/g,'<code>$1</code>')
             .replace(/^---$/gm,'<hr>')
             .replace(/(https?:\/\/[^\s<）)]+)/g,'<a href="$1" target="_blank" style="color:#1a5fb4">$1</a>');
  // 列表
  const seg = html.split('\n');
  let out = '', inUl = false, inOl = false;
  for (let ln of seg) {
    const t2 = ln.trim();
    if (/^-\s+/.test(t2)) {
      if (inOl) { out += '</ol>'; inOl = false; }
      if (!inUl) { out += '<ul>'; inUl = true; }
      out += '<li>' + t2.replace(/^-\s+/,'') + '</li>';
    } else if (/^\d+\.\s+/.test(t2)) {
      if (inUl) { out += '</ul>'; inUl = false; }
      if (!inOl) { out += '<ol>'; inOl = true; }
      out += '<li>' + t2.replace(/^\d+\.\s+/,'') + '</li>';
    } else {
      if (inUl) { out += '</ul>'; inUl = false; }
      if (inOl) { out += '</ol>'; inOl = false; }
      if (t2 === '') out += '';
      else if (/^<(p|ul|ol|table|hr|h)/.test(t2)) out += t2;
      else out += '<p>' + t2 + '</p>';
    }
  }
  if (inUl) out += '</ul>';
  if (inOl) out += '</ol>';
  return out;
}

function scrollDown(instant){
  requestAnimationFrame(()=>{
    chat.scrollTo({top:chat.scrollHeight, behavior: instant ? 'auto' : 'smooth'});
  });
}

function addMe(text){
  const d = document.createElement('div');
  d.className = 'msg me';
  d.innerHTML = `<div class="bubble-me">${esc(text)}</div>`;
  chat.appendChild(d);
  scrollDown();
}

function addBot(html){
  const d = document.createElement('div');
  d.className = 'msg bot';
  d.innerHTML = `<div class="bot-wrap">
      <div class="bot-avatar"><span class="dot">AI</span>注册答疑助手</div>
      <div class="card ans">${html}</div>
    </div>`;
  chat.appendChild(d);
  scrollDown();
  return d;
}

function addTyping(){
  const d = document.createElement('div');
  d.className = 'msg bot';
  d.innerHTML = `<div class="bot-wrap">
      <div class="bot-avatar"><span class="dot">AI</span>注册答疑助手</div>
      <div class="card"><div class="typing"><i></i><i></i><i></i></div></div>
    </div>`;
  chat.appendChild(d);
  scrollDown();
  return d;
}

/* 渲染一条完整答案 */
function renderAnswer(item, others, userQuery){
  let h = '';
  h += `<div class="ans-q"><span class="n">Q</span><span>${esc(item.q)}</span></div>`;
  h += `<div class="ans-body">${md(item.a)}</div>`;
  h += `<div class="ans-src"><span class="tag">依据原文</span>${esc(item.src)} · 《黄埔区教师资格定期注册培训（2026）》</div>`;
  h += `<button class="fb-btn" data-q="${esc(userQuery || item.q)}">🤔 没帮到你？点此反馈</button><button class="ai-btn" data-q="${esc(userQuery || item.q)}">✨ 不满意？用 AI 重新回答</button>`;
  if (others && others.length){
    h += `<div class="related"><div class="related-t">可能你还想了解：</div>`;
    for (const o of others.slice(0,3)){
      h += `<span class="chip" data-id="${o.id}">${esc(o.q)}</span>`;
    }
    h += `</div>`;
  }
  return h;
}

/* 反馈按钮：复制问题文本，引导发给管理员 */
function copyText(t){
  if (navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(t).catch(()=>legacyCopy(t));
  }
  return Promise.resolve(legacyCopy(t));
}
function legacyCopy(t){
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

/* 主问答流程 */
function ask(text){
  text = String(text).trim();
  if (!text) return;
  addMe(text);
  const tp = addTyping();

  setTimeout(()=>{
    tp.remove();
    const r = answer(text);

    if (r.type === 'answer'){
      addBot(renderAnswer(r.main, r.others, text));
      rememberHistory(text, r.main.a);
      try{ logQuestion(text, 'local', r.main.id); }catch(e){}
    } else {
      // 低置信度 → 大模型增强回答（基于检索到的原文片段）
      try{ logQuestion(text, r.type === 'candidates' ? 'candidate' : 'fallback', null); }catch(e){}
      aiAnswer(text, r);
    }
  }, 340);
}

/* ============ AI 增强（DeepSeek，经 Cloudflare Worker 代理，Key 不暴露） ============ */
const AI_CONFIG = {
  /* 部署 Cloudflare Worker 后，把下面换成你的 Worker 地址，
     形如 https://zhuce-qa-proxy.你的子域名.workers.dev  */
  proxyUrl: "https://zhuce-qa-proxy.liupengjin1207.workers.dev",
  model: "deepseek-chat"
};
/* 对话记忆（最近4轮） */
const HISTORY = [];
function rememberHistory(q, a){
  HISTORY.push({role:"user", content:q}, {role:"assistant", content:a});
  if (HISTORY.length > 8) HISTORY.splice(0, HISTORY.length - 8);
}

async function aiAnswer(text, r){
  // 取检索 top5 原文片段作为依据（r 可为 null，即手动点击"AI重新回答"）
  const top = (typeof search === 'function' ? search(text, 5) : []).map(x=>x.item);
  // 材料池兜底：检索分数都很低时，强制附上核心枢纽条目，确保 AI 有可对照的政策原文
  let pool = top;
  if (!top.length || top[0].score < 8){
    const hubs = KNOWLEDGE.filter(k=>['hold-1','fail-cases','who-scope','who-2021','cond-diff'].includes(k.id));
    pool = top.concat(hubs.filter(h=>!top.includes(h)));
  }
  const materials = pool
    .map((k,i)=>`【片段${i+1}】${k.q}\n${k.a}\n（出处：${k.src}）`).join('\n\n');

  const sys = `你是"2026年黄埔区教师资格定期注册"答疑助手。严格依据下面提供的培训材料片段回答用户问题。

规则：
1. 只能依据材料片段作答，禁止编造材料里没有的规定、时间、数字
2. 回答要口语化、条理清晰，重点内容加粗
3. 回答末尾标注所依据的出处（如：依据：第X页）
4. 如果材料片段确实没有覆盖用户的问题，直接回答"这个问题培训材料里没有明确写到，建议咨询区教师资格定期注册工作办公室"，不要推测
5. 结合对话历史理解代词和省略（如"那产假呢"指上一个话题）
6. 用户描述自己的个人情形时（如"有段时间没上班""考核基本合格"），不要只说范围条款，要对照材料中的暂缓注册四种情形和注册不合格四种情形逐条分析，指出最可能适用的情形、判定标准（时长/等次/原因）和后续处理办法，并提醒关键分界点

培训材料片段：
${materials}`;

  const msgs = [{role:"system", content:sys},
    ...HISTORY.slice(-4),
    {role:"user", content:text}];

  // 创建带流式输出的卡片
  const card = document.createElement('div');
  card.className = 'msg bot';
  card.innerHTML = `<div class="bot-wrap">
      <div class="bot-avatar"><span class="dot">AI</span>注册答疑助手 <span class="ai-badge">AI深度回答</span></div>
      <div class="card ans"><div class="ans-body" id="ai-stream"><div class="typing"><i></i><i></i><i></i></div></div></div>
    </div>`;
  chat.appendChild(card);
  scrollDown();
  const streamEl = card.querySelector('#ai-stream');

  try {
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 30000); // 30秒超时保护
    const resp = await fetch(AI_CONFIG.proxyUrl, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({model: AI_CONFIG.model, messages: msgs, stream: true, temperature: 0.3, max_tokens: 1200}),
      signal: ctrl.signal
    });
    clearTimeout(timer);
    if (!resp.ok){
      throw new Error('HTTP ' + resp.status + (resp.status===402 ? '：余额不足' : ''));
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '', full = '';
    streamEl.innerHTML = '';
    while (true){
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const ln of lines){
        if (!ln.startsWith('data:')) continue;
        const data = ln.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const j = JSON.parse(data);
          const delta = j.choices?.[0]?.delta?.content || '';
          if (delta){
            full += delta;
            streamEl.innerHTML = md(full);
            scrollDown(true);
          }
        } catch(e){}
      }
    }
    rememberHistory(text, full);
    attachFb(card, text);
    if (!full) throw new Error('空回复');
    else { try{ logQuestion(text, 'ai', null); }catch(e){} }
  } catch(err){
    // 失败 → 回退到原有候选/兜底逻辑
    let h;
    if (r && r.type === 'candidates' && r.list.length){
      h = `<div class="fallback">我可能没完全理解你的问题，你是在问下面哪一个？</div><div class="cand-list">`;
      for (const c of r.list){
        h += `<button class="cand" data-id="${c.item.id}"><span class="c-cat">${esc(c.item.cat)}</span>${esc(c.item.q)}</button>`;
      }
      h += `</div>`;
    } else {
      h = `<div class="fallback"><span class="big">这个问题材料里没有明确写到</span>
        为避免给你错误信息，我不做推测。建议你：</div>
        <div class="fb-tip">
        ① 换个说法再问一次（如带上「首次注册」「继续教育」「暂缓」等关键词）<br>
        ② 直接咨询<b>本区教师资格定期注册工作负责人</b><br>
        ③ 或查看培训材料原文对应章节
        </div>`;
    }
    streamEl.closest('.card').innerHTML = `<div class="ans-body">${h}</div>`;
  }
}

/* 事件绑定 */
sendBtn.addEventListener('click', ()=>{ ask(input.value); input.value=''; autoSize(); });
input.addEventListener('keydown', e=>{
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); ask(input.value); input.value=''; autoSize(); }
});
function autoSize(){ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,110)+'px'; }
input.addEventListener('input', autoSize);

/* 点击 chip / 候选 / 反馈 */
chat.addEventListener('click', e=>{
  const fb = e.target.closest('.fb-btn');
  if (fb){
    const q = fb.dataset.q || '';
    copyText('【答疑助手问题反馈】' + q).then(()=>{
      fb.classList.add('fb-done');
      fb.textContent = '✅ 问题已复制，请粘贴发给管理员';
      setTimeout(()=>{ fb.classList.remove('fb-done'); fb.innerHTML='🤔 没帮到你？点此反馈'; }, 4000);
    });
    return;
  }
  const aib = e.target.closest('.ai-btn');
  if (aib){
    const q = aib.dataset.q || aib.parentNode.querySelector('.fb-btn')?.dataset.q || '';
    aib.classList.add('loading');
    aib.textContent = '⏳ AI 思考中…';
    // 禁用同卡片其他按钮，避免重复点击
    aib.parentNode.querySelectorAll('.ai-btn').forEach(b=>{ b.disabled=true; });
    aiAnswer(q, null);
    return;
  }
  const chip = e.target.closest('.chip, .cand, .quick');
  if (!chip) return;
  const id = chip.dataset.id;
  const item = KNOWLEDGE.find(k=>k.id===id);
  if (!item) return;
  addMe(item.q);
  const tp = addTyping();
  setTimeout(()=>{
    tp.remove();
    const others = KNOWLEDGE.filter(k=>k.cat===item.cat && k.id!==item.id).slice(0,3);
    addBot(renderAnswer(item, others, item.q));
  }, 300);
});

/* AI 流式回答成功后也追加反馈按钮 */
function attachFb(card, q){
  const body = card.querySelector('.ans-body');
  if (body && !card.querySelector('.fb-btn')){
    const b = document.createElement('button');
    b.className = 'fb-btn'; b.dataset.q = q;
    b.innerHTML = '🤔 没帮到你？点此反馈';
    body.appendChild(b);
  }
}

function welcome(){
  showPwaBanner();
  let h = `<div class="welcome">
      <div class="wel-h">你好，我是注册答疑助手 👋</div>
      <div class="wel-s">关于 2026 年教师资格定期注册的问题，<br>直接问我，我按官方培训材料原文回答。</div>
    </div>`;
  h += `<div class="quick-t">常见问题 · 点一下即可查看</div><div class="quick-grid">`;
  const icons = ['❓','📖','🕐','📄','🔄','⏸️','🚫','🎓','💻','✅','⚠️','🔀'];
  QUICK_QUESTIONS.forEach((q,i)=>{
    h += `<button class="quick" data-id="${q.id}"><span class="qi">${icons[i]||'❓'}</span><span class="qt">${esc(q.label)}</span><span class="qa">›</span></button>`;
  });
  h += `</div>`;
  addBot(h);
}
